<script>
// Safari 缓存自检：用带时间戳的请求拉取线上最新版本号，若与当前页面版本不一致，自动跳转新版（绕过缓存）
(async function checkAppUpdate(){
  try{
    if(location.protocol==='file:') return; // 本地文件无需自检
    const res=await fetch(location.pathname+'?update_check='+Date.now(),{cache:'no-store'});
    if(!res.ok) return;
    const txt=await res.text();
    const m=txt.match(/app-version" content="([^"]+)"/);
    const remote=m?m[1]:null;
    const localMeta=document.querySelector('meta[name="app-version"]');
    const localV=localMeta?localMeta.getAttribute('content'):null;
    if(remote&&localV&&remote!==localV){
      showToast&&showToast('🔄 发现新版本，正在自动更新…');
      setTimeout(function(){
        location.replace(location.href.split('#')[0].split('?')[0]+'?v='+encodeURIComponent(remote));
      },600);
    }
  }catch(e){/* 静默失败，不影响使用 */}
})();
</script>

// 诗词全文与释义（key 与 POEM_STAGES 中的字符串完全一致；t=全文，m=释义）
const POEM_DETAILS={
'《江南》汉乐府':{t:'江南可采莲，莲叶何田田。鱼戏莲叶间。鱼戏莲叶东，鱼戏莲叶西，鱼戏莲叶南，鱼戏莲叶北。',m:'江南又到了采莲的季节，莲叶多么茂盛。小鱼在莲叶间游来游去，一会儿东一会儿西，快乐极了。'},
'《长歌行》汉乐府':{t:'青青园中葵，朝露待日晞。阳春布德泽，万物生光辉。常恐秋节至，焜黄华叶衰。百川东到海，何时复西归？少壮不努力，老大徒伤悲。',m:'园里的葵菜绿油油，早上的露水等太阳晒干。春天把阳光雨露洒给万物，一切都有生机。可秋天一到，叶子就枯黄了。江河东流入海，什么时候才能回来呢？少年时不努力，老了只能白白伤心。'},
'《敕勒歌》北朝民歌':{t:'敕勒川，阴山下。天似穹庐，笼盖四野。天苍苍，野茫茫，风吹草低见牛羊。',m:'敕勒族居住的地方在阴山脚下。天空像圆圆的大帐篷，罩住草原的四面八方。天蓝蓝，草原辽阔无边，风一吹过，草弯下腰就露出成群的牛羊。'},
'《咏鹅》骆宾王':{t:'鹅，鹅，鹅，曲项向天歌。白毛浮绿水，红掌拨清波。',m:'鹅呀鹅呀鹅，弯着脖子向天唱歌。雪白的羽毛浮在绿水上，红色的脚掌划动清清的水波。'},
'《风》李峤':{t:'解落三秋叶，能开二月花。过江千尺浪，入竹万竿斜。',m:'风能吹落秋天的树叶，也能吹开春天的鲜花。它吹过江面能掀起千尺巨浪，吹进竹林能让万竿翠竹倾斜摇摆。'},
'《咏柳》贺知章':{t:'碧玉妆成一树高，万条垂下绿丝绦。不知细叶谁裁出，二月春风似剪刀。',m:'高高的柳树像用碧玉打扮过，无数柳条像绿色丝带垂下来。不知这细细的柳叶是谁裁剪出来的？原来二月的春风就像一把神奇的剪刀。'},
'《回乡偶书》贺知章':{t:'少小离家老大回，乡音无改鬓毛衰。儿童相见不相识，笑问客从何处来。',m:'小时候离开家乡，老了才回来，家乡话没变，可两鬓头发已经白了。村里的孩子见到我都不认识，笑着问我：客人从哪里来呀？'},
'《登鹳雀楼》王之涣':{t:'白日依山尽，黄河入海流。欲穷千里目，更上一层楼。',m:'太阳依着远山慢慢落下，黄河向大海奔流。想看到千里之外的风光，就要再登上一层楼。'},
'《凉州词·黄河远上白云间》王之涣':{t:'黄河远上白云间，一片孤城万仞山。羌笛何须怨杨柳，春风不度玉门关。',m:'黄河好像从白云间流下来，一座孤城守在万重高山间。羌笛何必吹奏哀怨的《折杨柳》呢？春风本来就吹不到玉门关外啊。'},
'《春晓》孟浩然':{t:'春眠不觉晓，处处闻啼鸟。夜来风雨声，花落知多少。',m:'春天的夜里睡得香甜不知不觉天亮了，到处都能听到鸟儿的叫声。想起昨夜的风声雨声，不知有多少花儿被吹落了。'},
'《凉州词·葡萄美酒夜光杯》王翰':{t:'葡萄美酒夜光杯，欲饮琵琶马上催。醉卧沙场君莫笑，古来征战几人回？',m:'葡萄美酒斟满夜光杯，正想畅饮，马上又传来琵琶催征的乐声。即使醉倒在战场上也请别笑，自古以来出征打仗的人有几个能回来呢？'},
'《出塞》王昌龄':{t:'秦时明月汉时关，万里长征人未还。但使龙城飞将在，不教胡马度阴山。',m:'还是秦汉时的明月和边关，远征万里的将士们还没能回家。只要有像李广那样的飞将军镇守，绝不让敌人的战马越过阴山。'},
'《芙蓉楼送辛渐》王昌龄':{t:'寒雨连江夜入吴，平明送客楚山孤。洛阳亲友如相问，一片冰心在玉壶。',m:'冷冷的秋雨洒满江面，夜里来到吴地。清晨送走友人，只留楚山孤零零。洛阳的亲友如果问起我，就说我的心依然像玉壶里的冰一样纯洁。'},
'《鹿柴》王维':{t:'空山不见人，但闻人语响。返景入深林，复照青苔上。',m:'空旷的山里看不见人，只偶尔听到有人说话的声音。夕阳的金光射进深林，又照在那片青苔上。'},
'《送元二使安西》王维':{t:'渭城朝雨浥轻尘，客舍青青柳色新。劝君更尽一杯酒，西出阳关无故人。',m:'渭城早晨的雨打湿了路上尘土，旅店旁的柳枝显得格外清新。朋友，请再干了这杯酒吧，向西出了阳关，就再没有老朋友陪你啦。'},
'《九月九日忆山东兄弟》王维':{t:'独在异乡为异客，每逢佳节倍思亲。遥知兄弟登高处，遍插茱萸少一人。',m:'独自一人在他乡做客，每到节日就加倍想念亲人。远远想到兄弟们登高望远、身上插着茱萸时，会发现唯独少了我一个人。'},
'《静夜思》李白':{t:'床前明月光，疑是地上霜。举头望明月，低头思故乡。',m:'床前洒满明亮的月光，好像地上铺了一层白霜。抬起头望着天上的明月，低下头思念起遥远的故乡。'},
'《古朗月行》李白':{t:'小时不识月，呼作白玉盘。又疑瑶台镜，飞在青云端。',m:'小时候不认识月亮，把它叫作白玉盘。又怀疑它是仙人家的镜子，飞挂在了青云的边上。'},
'《望庐山瀑布》李白':{t:'日照香炉生紫烟，遥看瀑布挂前川。飞流直下三千尺，疑是银河落九天。',m:'阳光照在香炉峰上，升起紫色的云烟。远远望去，瀑布像一条白练挂在山前。水流飞奔直下足足三千尺，让人以为是银河从九重天倾泻下来。'},
'《赠汪伦》李白':{t:'李白乘舟将欲行，忽闻岸上踏歌声。桃花潭水深千尺，不及汪伦送我情。',m:'我坐上小船正要出发，忽然听见岸上传来踏歌送行的声音。桃花潭的水就算有千尺深，也比不上汪伦送别我的情谊。'},
'《黄鹤楼送孟浩然之广陵》李白':{t:'故人西辞黄鹤楼，烟花三月下扬州。孤帆远影碧空尽，唯见长江天际流。',m:'老朋友在黄鹤楼向我挥手告别，在柳絮如烟、繁花似锦的三月去扬州。船越走越远，帆影消失在碧蓝的天空尽头，只看见长江水向天边奔流。'},
'《早发白帝城》李白':{t:'朝辞白帝彩云间，千里江陵一日还。两岸猿声啼不住，轻舟已过万重山。',m:'清晨告别彩云缭绕的白帝城，千里之外的江陵一天就到了。两岸猿猴的叫声还没停，轻快的小船已经驶过了万重青山。'},
'《望天门山》李白':{t:'天门中断楚江开，碧水东流至此回。两岸青山相对出，孤帆一片日边来。',m:'天门山从中断开，给楚江让出通道，碧绿的江水东流到这里回旋。两岸的青山相对耸立，一只小帆船从太阳那边驶来。'},
'《别董大》高适':{t:'千里黄云白日曛，北风吹雁雪纷纷。莫愁前路无知己，天下谁人不识君。',m:'千里黄云遮天蔽日，天色昏暗，北风送着大雁，大雪纷飞。不要担心前面的路上没有知心朋友，天下有谁不认识你呢？'},
'《绝句·两个黄鹂鸣翠柳》杜甫':{t:'两个黄鹂鸣翠柳，一行白鹭上青天。窗含西岭千秋雪，门泊东吴万里船。',m:'两只黄鹂在翠绿的柳枝间鸣叫，一行白鹭飞上蓝天。窗口正对着西岭千年不化的积雪，门外停泊着要去东吴的万里航船。'},
'《春夜喜雨》杜甫':{t:'好雨知时节，当春乃发生。随风潜入夜，润物细无声。野径云俱黑，江船火独明。晓看红湿处，花重锦官城。',m:'好雨好像知道时节，春天一到就下起来。它随着春风在夜里悄悄落下，无声地滋润着万物。田野小路和乌云一样黑漆漆，只有江上的船灯亮着。天亮后去看带雨的红花，锦官城里的花儿开得沉甸甸的。'},
'《绝句·迟日江山丽》杜甫':{t:'迟日江山丽，春风花草香。泥融飞燕子，沙暖睡鸳鸯。',m:'春天阳光普照，江山秀丽，春风送来花草的芳香。燕子衔着湿泥飞来飞去筑巢，鸳鸯睡在温暖的沙滩上。'},
'《江雪》柳宗元':{t:'千山鸟飞绝，万径人踪灭。孤舟蓑笠翁，独钓寒江雪。',m:'所有的山上都看不到飞鸟，所有的路上都没有人的踪迹。只有一位披蓑戴笠的老渔翁，坐在小船上独自在漫天风雪的寒江上钓鱼。'},
'《寻隐者不遇》贾岛':{t:'松下问童子，言师采药去。只在此山中，云深不知处。',m:'松树下我问童子：你师父呢？童子说师父采药去了。他就在这座大山里，可山上云雾深深，不知道具体在哪里。'},
'《枫桥夜泊》张继':{t:'月落乌啼霜满天，江枫渔火对愁眠。姑苏城外寒山寺，夜半钟声到客船。',m:'月亮落下，乌鸦啼叫，寒霜满天。江边的枫树和点点渔火，伴着满怀愁绪的我难以入眠。半夜里，姑苏城外寒山寺的钟声，悠悠传到了客船上。'},
'《渔歌子》张志和':{t:'西塞山前白鹭飞，桃花流水鳜鱼肥。青箬笠，绿蓑衣，斜风细雨不须归。',m:'西塞山前白鹭自由地飞翔，桃花盛开的江水里鳜鱼肥美。老渔翁戴着青斗笠、披着绿蓑衣，在斜风细雨中悠然垂钓，都舍不得回家。'},
'《塞下曲·月黑雁飞高》卢纶':{t:'月黑雁飞高，单于夜遁逃。欲将轻骑逐，大雪满弓刀。',m:'没有月亮的夜里，大雁受惊高高飞起，敌军首领趁夜悄悄逃跑了。将军正要率领轻骑兵去追赶，纷纷扬扬的大雪落满了弓和刀。'},
'《望洞庭》刘禹锡':{t:'湖光秋月两相和，潭面无风镜未磨。遥望洞庭山水翠，白银盘里一青螺。',m:'湖水和秋月融为一体，风平浪静的湖面像没有打磨的铜镜。远远望去洞庭湖山水苍翠可爱，就像白银盘里托着一颗小小的青螺。'},
'《浪淘沙·九曲黄河万里沙》刘禹锡':{t:'九曲黄河万里沙，浪淘风簸自天涯。如今直上银河去，同到牵牛织女家。',m:'弯弯曲曲的黄河夹带着万里黄沙，波涛翻滚像从天边奔来。如今我要沿着黄河直上银河，一起去牛郎织女的家里做客。'},
'《赋得古原草送别》白居易':{t:'离离原上草，一岁一枯荣。野火烧不尽，春风吹又生。远芳侵古道，晴翠接荒城。又送王孙去，萋萋满别情。',m:'古原上的野草多么茂密，每年枯萎又繁荣。野火烧也烧不尽它，春风一吹它又生长出来。芳草蔓延到遥远的古道，阳光下的翠绿连接着荒城。又到了送别朋友的时候，茂密的青草都好像装满了依依不舍的深情。'},
'《池上》白居易':{t:'小娃撑小艇，偷采白莲回。不解藏踪迹，浮萍一道开。',m:'小娃娃撑着小船，偷偷采了池里的白莲回来。他还不懂得要藏好自己的踪迹，船儿过处，水面的浮萍分开了一条小路。'},
'《忆江南》白居易':{t:'江南好，风景旧曾谙。日出江花红胜火，春来江水绿如蓝。能不忆江南？',m:'江南真好，那儿的风景我曾经很熟悉。太阳升起时，江边的鲜花比火还红；春天到来时，江水碧绿如蓝草。怎么能不怀念江南呢？'},
'《小儿垂钓》胡令能':{t:'蓬头稚子学垂纶，侧坐莓苔草映身。路人借问遥招手，怕得鱼惊不应人。',m:'一个头发乱蓬蓬的小孩在学钓鱼，侧身坐在莓苔上，野草掩映着他的身影。过路人向他问路，他远远地摆手不回答，生怕惊动了鱼儿。'},
'《悯农·春种一粒粟》李绅':{t:'春种一粒粟，秋收万颗子。四海无闲田，农夫犹饿死。',m:'春天种下一粒种子，秋天就能收获许多粮食。可是天下没有一块闲着的田地，辛苦种田的农民还是有人会饿死。'},
'《悯农·锄禾日当午》李绅':{t:'锄禾日当午，汗滴禾下土。谁知盘中餐，粒粒皆辛苦。',m:'农民在正午的烈日下锄地，汗水一滴一滴落进禾苗下的泥土里。有谁知道盘子里的饭食，每一粒都饱含着农民的辛苦呢？'},
'《江上渔者》范仲淹':{t:'江上往来人，但爱鲈鱼美。君看一叶舟，出没风波里。',m:'江上来来往往的人，只知道喜爱鲈鱼的鲜美。你看看那像一片树叶的小渔船，正在风浪里忽隐忽现地打鱼呢。'},
'《元日》王安石':{t:'爆竹声中一岁除，春风送暖入屠苏。千门万户曈曈日，总把新桃换旧符。',m:'爆竹声中旧的一年过去了，春风把暖意送进屠苏酒里。初升的太阳照耀着千家万户，大家都取下旧桃符换上新桃符。'},
'《泊船瓜洲》王安石':{t:'京口瓜洲一水间，钟山只隔数重山。春风又绿江南岸，明月何时照我还。',m:'京口和瓜洲只隔一条江，钟山也只隔着几重山峦。春风又吹绿了江南两岸，明月啊，什么时候能照着我回家呢？'},
'《书湖阴先生壁》王安石':{t:'茅檐长扫净无苔，花木成畦手自栽。一水护田将绿绕，两山排闼送青来。',m:'茅屋檐下经常打扫，干净得连青苔都没有，花草树木成行成垄，都是主人亲手栽种。一条溪水守护着稻田把绿意环绕，两座青山像推开门送来满眼青翠。'},
'《六月二十七日望湖楼醉书》苏轼':{t:'黑云翻墨未遮山，白雨跳珠乱入船。卷地风来忽吹散，望湖楼下水如天。',m:'乌云像打翻的墨汁一样涌来，还没遮住山头，白亮的雨点就像珍珠一样乱跳进船里。忽然一阵大风卷地而来，把乌云和暴雨吹散，望湖楼下的湖水平静得像天空一样。'},
'《饮湖上初晴后雨》苏轼':{t:'水光潋滟晴方好，山色空蒙雨亦奇。欲把西湖比西子，淡妆浓抹总相宜。',m:'晴天时西湖水波闪动真美好，下雨时山色朦胧也很奇妙。如果把西湖比作美女西施，无论淡妆还是浓妆都是那么合适。'},
'《惠崇春江晚景》苏轼':{t:'竹外桃花三两枝，春江水暖鸭先知。蒌蒿满地芦芽短，正是河豚欲上时。',m:'竹林外两三枝桃花初开，春天江水变暖，鸭子最先知道。蒌蒿长满地面，芦苇冒出短短的嫩芽，这正是河豚要逆流而上的时候。'},
'《题西林壁》苏轼':{t:'横看成岭侧成峰，远近高低各不同。不识庐山真面目，只缘身在此山中。',m:'横着看是连绵的山岭，侧着看是高耸的山峰，从远近高低不同的位置看，庐山的模样都不一样。看不清庐山真正的样子，只因为自己就在这座山里呀。'},
'《夏日绝句》李清照':{t:'生当作人杰，死亦为鬼雄。至今思项羽，不肯过江东。',m:'活着就要做杰出的人，死了也要做英雄豪杰。直到今天人们还在思念项羽，因为他宁死也不肯逃到江东去。'},
'《三衢道中》曾几':{t:'梅子黄时日日晴，小溪泛尽却山行。绿阴不减来时路，添得黄鹂四五声。',m:'梅子黄熟的季节天天都是好天气，我乘小船到小溪尽头，再改走山路继续前行。山路上绿树成荫，不比来时差，还多了几声黄鹂清脆的鸣叫。'},
'《示儿》陆游':{t:'死去元知万事空，但悲不见九州同。王师北定中原日，家祭无忘告乃翁。',m:'我本来知道人死后就什么都不知道了，只是悲伤没能亲眼看到国家统一。等到朝廷军队收复中原的那一天，家祭时别忘了把这个好消息告诉你们的父亲。'},
'《秋夜将晓出篱门迎凉有感》陆游':{t:'三万里河东入海，五千仞岳上摩天。遗民泪尽胡尘里，南望王师又一年。',m:'三万里长的黄河向东流入大海，五千仞高的华山高耸直插云天。中原的百姓在敌人的统治下眼泪都流干了，他们盼望着朝廷军队北伐，一年又一年地空等。'},
'《四时田园杂兴·梅子金黄》范成大':{t:'梅子金黄杏子肥，麦花雪白菜花稀。日长篱落无人过，惟有蜻蜓蛱蝶飞。',m:'梅子变得金黄，杏子长得肥大，荞麦花一片雪白，油菜花倒显得稀稀落落。白天变长了，篱笆边没人走过，只有蜻蜓和蝴蝶在飞舞。'},
'《四时田园杂兴·昼出耘田》范成大':{t:'昼出耘田夜绩麻，村庄儿女各当家。童孙未解供耕织，也傍桑阴学种瓜。',m:'大人们白天去田里除草，晚上在家搓麻线，村里的男男女女都各自当家干活。小孩子虽然还不懂耕田织布，也在桑树荫下学着大人种瓜呢。'},
'《小池》杨万里':{t:'泉眼无声惜细流，树阴照水爱晴柔。小荷才露尖尖角，早有蜻蜓立上头。',m:'泉眼悄悄无声，好像舍不得细细的水流，树荫倒映在水面上，喜爱这晴日的温柔。小小的荷叶刚露出尖尖的角，早就有蜻蜓站在上面了。'},
'《晓出净慈寺送林子方》杨万里':{t:'毕竟西湖六月中，风光不与四时同。接天莲叶无穷碧，映日荷花别样红。',m:'六月里的西湖，风光到底和其他季节不同：碧绿的莲叶一直铺到天边，阳光下的荷花显得格外鲜红美丽。'},
'《春日》朱熹':{t:'胜日寻芳泗水滨，无边光景一时新。等闲识得东风面，万紫千红总是春。',m:'风和日丽的日子到泗水边赏花踏青，无边无际的风光焕然一新。随便一瞥就能感受到春风的面貌，万紫千红的景象都是春天的杰作。'},
'《观书有感》朱熹':{t:'半亩方塘一鉴开，天光云影共徘徊。问渠那得清如许？为有源头活水来。',m:'半亩大的方形池塘像一面打开的镜子，天空的光和云的影子在水面一起晃动。要问它为什么这么清澈？因为源头总有活水不断流进来。'},
'《题临安邸》林升':{t:'山外青山楼外楼，西湖歌舞几时休？暖风熏得游人醉，直把杭州作汴州。',m:'青山之外还有青山，高楼之外还有高楼，西湖边的歌舞什么时候才能停止？暖洋洋的风把游人吹得醉醺醺，简直把杭州当成了故都汴州。'},
'《游园不值》叶绍翁':{t:'应怜屐齿印苍苔，小扣柴扉久不开。春色满园关不住，一枝红杏出墙来。',m:'大概是园主人爱惜苍苔，怕我的木底鞋在上面留下脚印吧，我轻轻敲着柴门，好久也没人来开。可满园的春色是关不住的，瞧，一枝红杏已经伸出墙外来啦。'},
'《独坐敬亭山》李白':{t:'众鸟高飞尽，孤云独去闲。相看两不厌，只有敬亭山。',m:'鸟儿们都高高地飞走了，孤零零的云也悠闲地飘远了。和我互相望着、怎么看都不厌倦的，只有眼前的敬亭山。'},
'《宿建德江》孟浩然':{t:'移舟泊烟渚，日暮客愁新。野旷天低树，江清月近人。',m:'把船停在烟雾迷蒙的小洲边，傍晚时分，旅途的愁绪又涌上心头。原野空旷，远处的天空显得比树还低，江水清澈，水中的月亮好像离人更近了。'},
'《舟夜书所见》查慎行':{t:'月黑见渔灯，孤光一点萤。微微风簇浪，散作满河星。',m:'没有月亮的夜里，只见渔船上一盏孤灯，像一只萤火虫发出微弱的光。微风吹起细细的波浪，灯光倒映在水中，散开成满河的星星。'},

'《村居》高鼎':{t:'草长莺飞二月天，拂堤杨柳醉春烟。儿童散学归来早，忙趁东风放纸鸢。',m:'农历二月，青草生长，黄莺飞舞，杨柳轻拂堤岸，像陶醉在春天的烟雾里。孩子们放学回来得早，赶忙趁着东风放起了风筝。'},
'《己亥杂诗·九州生气恃风雷》龚自珍':{t:'九州生气恃风雷，万马齐喑究可哀。我劝天公重抖擞，不拘一格降人才。',m:'中国要有生机勃勃的局面，得依靠像风雷一样的社会变革。如今到处沉默无声，实在令人悲哀。我奉劝上天重新振作精神，不要只用一种标准选用人才。'},
'《山行》杜牧':{t:'远上寒山石径斜，白云生处有人家。停车坐爱枫林晚，霜叶红于二月花。',m:'沿着弯弯的石子小路远远走向深秋的寒山，白云缭绕的地方还有人家。我停下车来，因为太喜爱这傍晚的枫林，经霜的枫叶比二月的鲜花还要红艳。'},
'《清明》杜牧':{t:'清明时节雨纷纷，路上行人欲断魂。借问酒家何处有？牧童遥指杏花村。',m:'清明节的时候细雨纷纷飘落，路上的行人个个愁苦伤感。请问哪里有酒馆？牧童远远地指着杏花深处的村庄。'},
'《江南春》杜牧':{t:'千里莺啼绿映红，水村山郭酒旗风。南朝四百八十寺，多少楼台烟雨中。',m:'辽阔的江南到处莺歌燕舞、绿树红花，水乡村庄和依山的城郭都有酒旗在风中飘动。南朝留下的四百八十多座古寺，无数楼台都笼罩在朦胧的烟雨中。'},
'《夜书所见》叶绍翁':{t:'萧萧梧叶送寒声，江上秋风动客情。知有儿童挑促织，夜深篱落一灯明。',m:'萧萧的梧桐叶送来阵阵寒意，江上的秋风让我想念起家乡。忽然看到远处篱笆下有一盏灯火，知道是孩子们在捉蟋蟀呢。'},
'《竹石》郑燮':{t:'咬定青山不放松，立根原在破岩中。千磨万击还坚劲，任尔东西南北风。',m:'竹子牢牢咬住青山绝不放松，它的根深深扎在破裂的岩石缝里。经过千万次磨难和打击，它依然挺拔坚强，任凭你东西南北的狂风怎么吹！'},
'《石灰吟》于谦':{t:'千锤万凿出深山，烈火焚烧若等闲。粉骨碎身浑不怕，要留清白在人间。',m:'石灰石经过千万次锤打才能从深山开采出来，面对烈火的焚烧也看得平平常常。就算粉身碎骨也不害怕，只要把清白留在人世间。'},
'《墨梅》王冕':{t:'我家洗砚池头树，朵朵花开淡墨痕。不要人夸好颜色，只留清气满乾坤。',m:'我家洗砚池边有一株梅树，朵朵梅花都像淡淡的墨迹点染而成。它不需要别人夸赞颜色艳丽，只愿把清雅的香气留满天地间。'},
'《蜂》罗隐':{t:'不论平地与山尖，无限风光尽被占。采得百花成蜜后，为谁辛苦为谁甜。',m:'不管是平地还是山尖，凡是鲜花盛开的地方，都被蜜蜂占领。它们采尽百花酿成蜂蜜后，到底为谁辛苦、又让谁品尝甜蜜呢？'},
'《赠刘景文》苏轼':{t:'荷尽已无擎雨盖，菊残犹有傲霜枝。一年好景君须记，最是橙黄橘绿时。',m:'荷花凋谢了，那擎雨的荷叶也枯萎了；菊花虽已残败，却还有傲霜挺立的枝条。一年中最好的景致你一定要记住，那就是橙子金黄、橘子青绿的初冬时节啊。'},

// 诗词全文+释义面板（插入推荐任务卡片内；点击面板不会误触发"完成背诵"）
// suffix：DOM id 后缀（推荐卡片用默认''；成果页复习用 '_r{stage}_{idx}'）；startHidden：默认是否收起
function renderPoemDetail(poemKey,suffix='',startHidden=false){
  const d=POEM_DETAILS[poemKey];
  if(!d) return '<div class="poem-detail-missing" onclick="event.stopPropagation();">📖 全文请对照课本朗读</div>';
  const textHtml=(d.t||'').replace(/([，。？！；：])/g,'$1<br>');
  return `
    <div class="poem-detail-toggle" id="poemDetailToggle${suffix}" onclick="event.stopPropagation();togglePoemDetail('${suffix}')">📖 ${startHidden?'展开全文/释义':'收起全文/释义'}</div>
    <div class="poem-detail${startHidden?' hidden':''}" id="poemDetailBody${suffix}" onclick="event.stopPropagation();">
      <div class="poem-detail-text">${textHtml}</div>
      <div class="poem-detail-mean">💡 <b>释义：</b>${d.m||''}</div>
    </div>
  `;
}
function togglePoemDetail(suffix=''){
  const body=document.getElementById('poemDetailBody'+suffix);
  const toggle=document.getElementById('poemDetailToggle'+suffix);
  if(!body) return;
  const isHidden=body.classList.toggle('hidden');
  if(toggle) toggle.textContent=isHidden?'📖 展开全文/释义':'📖 收起全文/释义';
}

// 诗词搜索：按诗人或诗名关键字搜索全部阶段的诗词
function searchPoems(q){
  q=(q||'').trim();
  if(!q) return [];
  const res=[];
  POEM_STAGES.forEach((stage,st)=>{
    stage.poems.forEach((poem,i)=>{
      const bi=poem.indexOf('》');
      const title=poem.slice(0,bi+1);
      const author=poem.slice(bi+1);
      if(title.indexOf(q)>=0||author.indexOf(q)>=0){
        res.push({st,i,title,author,stageName:stage.name,done:!!state.completedPoems[st+'_'+i]});
      }
    });
  });
  return res;
}
// 渲染搜索结果下拉（点击结果选中；已背过的仅提示可去成果页复习）
function renderPoemSearch(q){
  const box=document.getElementById('poemSearchResults');
  if(!box) return;
  const res=searchPoems(q);
  if(res.length===0){ box.classList.add('hidden'); return; }
  box.classList.remove('hidden');
  const items=res.slice(0,10).map(r=>
    `<div class="poem-search-item${r.done?' done':''}" onclick="event.stopPropagation();${r.done?`pickSearchedDone('${r.title}')`:`selectPoem(${r.st},${r.i})`}">
      ${r.title}${r.author} <span class="poem-search-stage">· ${r.stageName}${r.done?' · 已背过':''}</span>
    </div>`).join('');
  const more=res.length>10?`<div class="poem-search-more">共找到 ${res.length} 首，仅显示前 10 首，请继续输入缩小范围</div>`:'';
  box.innerHTML=items+more;
}
function pickSearchedDone(title){
  showToast('《'+title.replace(/[《》]/g,'')+'》已经背过啦！可到「背诗词成果」页点击它复习');
}
// 搜索选中一首未背的诗词：设为当前待背（展示在框内），点击卡片即完成背诵
function selectPoem(st,idx){
  const box=document.getElementById('poemSearchResults');
  if(box) box.classList.add('hidden');
  const inp=document.getElementById('poemSearchInput');
  if(inp) inp.value='';
  state.currentPoemKey=st+'_'+idx;
  saveState();
  renderAll();
  showToast('📜 已选：'+POEM_STAGES[st].poems[idx]+'，点击卡片完成背诵');
}

function loadState(){
  let saved=null;
  let hadData=false;
  try{
    saved=localStorage.getItem(STORAGE_KEY);
    if(saved){ hadData=true;
      const parsed=JSON.parse(saved);
      // Migrate old completedTasks format
      state={...state,...parsed};
      if(!state.sem) state.sem='a';
      if(!state.view) state.view='home';
      if(!state.taskCompletionDates) state.taskCompletionDates={};
      if(!state.weeklyHouseholdTasks) state.weeklyHouseholdTasks=[];
      if(!state.householdWeekSeed) state.householdWeekSeed=0;
      if(!state.completedPoems) state.completedPoems={};
      if(!state.whiteGems) state.whiteGems=0;
      if(!state.householdRefreshCount) state.householdRefreshCount=0;
      if(!state.recSubjectKeys) state.recSubjectKeys=[];
      if(!state.recWeekSeed) state.recWeekSeed=0;
      if(!state.recDiscardedKeys) state.recDiscardedKeys=[];
      if(!state.currentPoemKey) state.currentPoemKey=null;
      if(state.weeklyGemRedeemed===undefined) state.weeklyGemRedeemed=null;
      if(state.exchangedColorGems===undefined) state.exchangedColorGems=0;
      if(state.exchangedWhiteGems===undefined) state.exchangedWhiteGems=0;
      if(state.xpTotal===undefined) state.xpTotal=0;
      migrateTaskKeys();
      // 强制重新生成家务任务（兼容新版带周种子的key）
      state.householdWeekSeed=0;
      state.weeklyHouseholdTasks=[];
      // 一次性清理：2024新版语文一上目录替换旧版后，清除旧版语文完成记录（同步扣回积分），避免串到新任务
      if(state.chineseA1V26!==true){

        state.recSubjectKeys=(state.recSubjectKeys||[]).filter(k=>k.indexOf(prefix)!==0);
        state.recDiscardedKeys=(state.recDiscardedKeys||[]).filter(k=>k.indexOf(prefix)!==0);
        if(cleared>0) state.points=Math.max(0,state.points-cleared*10);
        state.chineseA1V26=true;
      }
      // 一次性清理：2024新版教材（数学苏教版/科学教科版/道法统编版/英语改启蒙）替换旧版后，清除一年级上学期其他科目旧完成记录（同步扣回积分），避免串到新任务
      if(state.subjectsA1V27!==true){
        const prefix='1_a_';
        let cleared=0;
        Object.keys(state.completedTasks).forEach(k=>{ if(k.indexOf(prefix)===0){delete state.completedTasks[k];cleared++;} });
        Object.keys(state.taskCompletionDates).forEach(k=>{ if(k.indexOf(prefix)===0) delete state.taskCompletionDates[k]; });
        state.recSubjectKeys=(state.recSubjectKeys||[]).filter(k=>k.indexOf(prefix)!==0);
        state.recDiscardedKeys=(state.recDiscardedKeys||[]).filter(k=>k.indexOf(prefix)!==0);
        if(cleared>0) state.points=Math.max(0,state.points-cleared*10);
        state.subjectsA1V27=true;
      }
      // 一次性清理：科学扩充为6单元、道法扩充为8单元后，清除这两科旧完成记录（同步扣回积分），避免串到新任务
      if(state.sciMoralA1V28!==true){
        let cleared=0;
        ['1_a_science_','1_a_moral_'].forEach(prefix=>{
          Object.keys(state.completedTasks).forEach(k=>{ if(k.indexOf(prefix)===0){delete state.completedTasks[k];cleared++;} });
          Object.keys(state.taskCompletionDates).forEach(k=>{ if(k.indexOf(prefix)===0) delete state.taskCompletionDates[k]; });
          state.recSubjectKeys=(state.recSubjectKeys||[]).filter(k=>k.indexOf(prefix)!==0);
          state.recDiscardedKeys=(state.recDiscardedKeys||[]).filter(k=>k.indexOf(prefix)!==0);
        });
        if(cleared>0) state.points=Math.max(0,state.points-cleared*10);
        state.sciMoralA1V28=true;
      }
      // v2.9 口径升级：白宝石1颗=100积分（原50）；背诗不再直接+50积分，改由白宝石折合计入积分数量
      // 迁移：把历史上每首已背诗的+50分从积分中移除（其价值已由白宝石折合体现）；经验值≈当前任务积分
      if(state.gemsWorthV29!==true){
        const poemCount=Object.keys(state.completedPoems||{}).length;
        state.points=Math.max(0,(state.points||0)-poemCount*50);
        if(!state.xpTotal) state.xpTotal=state.points;
        state.gemsWorthV29=true;
      }
    }
  }catch(e){console.error('Load error:',e);}
  const today=new Date().toISOString().split('T')[0];
  // Also try old storage key
  if(!saved){
    try{
      const old=localStorage.getItem('yumuozuo_study_station');
      if(old){
        hadData=true;
        const parsed=JSON.parse(old);
        state={...state,...parsed};
        if(!state.sem) state.sem='a';
        if(!state.view) state.view='home';
        if(!state.taskCompletionDates) state.taskCompletionDates={};
        if(!state.weeklyHouseholdTasks) state.weeklyHouseholdTasks=[];
        if(!state.householdWeekSeed) state.householdWeekSeed=0;

        if(!state.recWeekSeed) state.recWeekSeed=0;
        if(!state.recDiscardedKeys) state.recDiscardedKeys=[];
        if(!state.currentPoemKey) state.currentPoemKey=null;
        if(state.weeklyGemRedeemed===undefined) state.weeklyGemRedeemed=null;
        if(state.exchangedColorGems===undefined) state.exchangedColorGems=0;
        if(state.exchangedWhiteGems===undefined) state.exchangedWhiteGems=0;
        if(state.xpTotal===undefined) state.xpTotal=0;
        migrateTaskKeys();
        // Migrate and save to new key
        saveState();
      }
    }catch(e){}
  }
  // 一次性积分清零（2026-08-12 用户要求：积分重新开始累计，只清一次）
  if(hadData&&state.pointsResetV1!==true){
    state.points=0;
    state.pointsResetV1=true;
    saveState();
  }
  state.checkinToday=(state.lastCheckin===today);
}

// 迁移旧任务key：旧格式 {grade}_{subject}_{unit}_{task} → 新格式 {grade}_{sem}_{subject}_{unit}_{task}（旧数据归入上学期）
function migrateTaskKeys(){
  const oldKeys=Object.keys(state.completedTasks);
  let migrated=false;
  oldKeys.forEach(k=>{
    if(k.indexOf('_')<0) return;
    const parts=k.split('_');
    if(parts.length===4 && /^[1-6]$/.test(parts[0]) && SUBJECTS.some(s=>s.id===parts[1])){
      const newKey=`${parts[0]}_a_${parts[1]}_${parts[2]}_${parts[3]}`;
      state.completedTasks[newKey]=state.completedTasks[k];
      delete state.completedTasks[k];
      if(state.taskCompletionDates[k]){
        state.taskCompletionDates[newKey]=state.taskCompletionDates[k];
        delete state.taskCompletionDates[k];
      }
      migrated=true;
    }
  });
  if(migrated){
    // recSubjectKeys / recDiscardedKeys 同样迁移
    const fixKeys=arr=>{
      if(!Array.isArray(arr)) return arr;
      return arr.map(k=>{
        if(typeof k!=='string') return k;
        const p=k.split('_');
        if(p.length===4 && /^[1-6]$/.test(p[0]) && SUBJECTS.some(s=>s.id===p[1])){
          return `${p[0]}_a_${p[1]}_${p[2]}_${p[3]}`;
        }
        return k;
      });
    };
    state.recSubjectKeys=fixKeys(state.recSubjectKeys);
    state.recDiscardedKeys=fixKeys(state.recDiscardedKeys);
  }
}

// 单元门控：判断某单元是否全部完成
function isUnitComplete(subjectId,ui){
  const units=gradeData()[subjectId]||[];
  const unit=units[ui];
  if(!unit) return false;
  return unit.tasks.every((t,ti)=>state.completedTasks[getTaskKey(subjectId,ui,ti)]);
}

// 单元门控：单元完成率（0~1）
function getUnitCompletionRate(subjectId,ui){
  const units=gradeData()[subjectId]||[];
  const unit=units[ui];
  if(!unit||unit.tasks.length===0) return 0;
  const done=unit.tasks.filter((t,ti)=>state.completedTasks[getTaskKey(subjectId,ui,ti)]).length;
  return done/unit.tasks.length;
}

// 单元门控：某单元是否为当前应推荐的单元
// 规则：前面所有单元都已全部完成 → 解锁；或该单元完成率>50% → 也可解锁后一单元
function isActiveUnit(subjectId,ui){
  for(let i=0;i<ui;i++){
    if(!isUnitComplete(subjectId,i)&&getUnitCompletionRate(subjectId,i)<=0.5) return false;
  }
  return true;
}

// Get current ISO week identifier
function getWeekSeed(){
  const now=new Date();
  const start=new Date(now.getFullYear(),0,1);
  const days=Math.floor((now-start)/(86400000));
  return Math.floor(days/7);
}

// 每周一 10:00 为周界的刷新标识：未到本周一10点视为仍属上周（本周推荐任务在周一10点才更新）
function getRefreshWeekId(){
  const now=new Date();
  const day=now.getDay(); // 0=Sun
  const mondayOffset=(day===0?-6:1-day);
  const d=new Date(now.getFullYear(),now.getMonth(),now.getDate()+mondayOffset);
  d.setHours(10,0,0,0); // 本周一 10:00
  if(now<d) d.setDate(d.getDate()-7); // 还没到周一10点 → 用上周一10点
  return d.getTime();
}

// 本周周一到周五的日期（与打卡日期同一时区逻辑）
function getWeekDates(){
  const now=new Date();
  const day=now.getUTCDay();
  const mondayOffset=(day===0?-6:1-day);
  const monday=new Date(Date.UTC(now.getUTCFullYear(),now.getUTCMonth(),now.getUTCDate()+mondayOffset));
  const dates=[];
  for(let i=0;i<5;i++) dates.push(new Date(monday.getTime()+i*86400000).toISOString().split('T')[0]);
  return dates;
}

// 本周周一到周五是否全部完成打卡
function isWeeklyCheckinComplete(){
  const dates=getWeekDates();
  return dates.every(d=>(state.checkinHistory||[]).indexOf(d)>=0);
}

// 兑换本周打卡连胜的白宝石：白宝石+1、积分+50（每周限1次）

  if(state.weeklyGemRedeemed===ws){

  showToast('💎 兑换成功！白宝石+1（折合100积分）');
}

// Seeded random for consistent weekly tasks
function seededRandom(seed){
  let s=seed;
  return function(){
    s=(s*16807+0)%2147483647;
    return (s-1)/2147483646;
  };
}

// 基于种子稳定洗牌（同一周+同刷新次数结果一致）
function seededShuffle(arr,seed){
  const a=[...arr];
  const rand=seededRandom(seed);
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(rand()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

// Generate this week's household tasks（每周固定5项，周一10点刷新，不随换任务更换）
function generateHouseholdTasks(force){
  const baseSeed=getRefreshWeekId()+state.grade*1000+(state.sem==='b'?500:0);
  if(!force && state.householdWeekSeed===baseSeed && state.weeklyHouseholdTasks.length>0) return;
  
  state.householdWeekSeed=baseSeed;
  const rand=seededRandom(baseSeed);
  const pool=[...HOUSEHOLD_TASK_POOL];
  // Fisher-Yates shuffle
  for(let i=pool.length-1;i>0;i--){
    const j=Math.floor(rand()*(i+1));
    [pool[i],pool[j]]=[pool[j],pool[i]];
  }
  state.weeklyHouseholdTasks=pool.slice(0,5); // Pick 5 tasks
  saveState();
}

// 由key还原任务信息（校验key是否仍有效）
function resolveTaskKey(key){
  const p=key.split('_');
  // 新格式: grade_sem_subject_unit_task
  if(p.length!==5) return null;
  const sid=p[2],ui=parseInt(p[3],10),ti=parseInt(p[4],10);
  const units=gradeData()[sid]||[];
  const unit=units[ui];
  const task=unit?unit.tasks[ti]:null;
  if(!task) return null;
  return {subject:SUBJECTS.find(s=>s.id===sid),unit:unit.unit,key,task,ui};
}

// 点击学科推荐卡片 = 更换任务
// 语数英科道法：在同一单元内随机换一个未完成任务；其他学科：全学期随机换一个
// 只要本学科当前范围内还有未完成的任务，就可以无限切换（不再被"已换过的"卡住）
function swapRecTask(key){
  const t=resolveTaskKey(key);
  if(!t){showToast('任务已失效，请刷新页面');return;}
  if(state.completedTasks[key]){showToast('✅ 该任务已完成，不能更换');return;}
  const sid=t.subject.id;
  const gated=UNIT_GATED_SUBJECTS.includes(sid);
  // 候选：本学科当前范围内所有未完成的任务，且 ≠ 当前推荐的 key
  const candidates=[];
  (gradeData()[sid]||[]).forEach((unit,ui)=>{
    if(gated&&ui!==t.ui) return; // 门控学科：只在该单元内
    unit.tasks.forEach((task,ti)=>{
      const k=getTaskKey(sid,ui,ti);
      if(k===key) return; // 不换回同一个
      if(state.completedTasks[k]) return; // 已完成的不可换
      candidates.push(k);
    });
  });
  if(candidates.length===0){
    showToast(gated?'本单元所有任务都已完成，太棒了🎉':'该学科所有任务都已完成，太棒了🎉');
    return;
  }
  const newKey=candidates[Math.floor(Math.random()*candidates.length)];
  // 替换推荐列表中的旧 key；不再写入 recDiscardedKeys（避免自我污染卡死）
  state.recSubjectKeys=(state.recSubjectKeys||[]).map(k=>k===key?newKey:k);
  saveState();
  renderRecommendations();
  showToast('🔄 已换一个新任务');
}

// 某一级诗词的完成进度
function getPoemProgress(stage){
  const total=POEM_STAGES[stage].poems.length;
  let done=0;
  for(let i=0;i<total;i++){
    if(state.completedPoems[stage+'_'+i]) done++;
  }
  return {done,total};
}

// 返回当前要背的诗：若 currentPoemKey 有效则返回它；否则在当前阶段（第一个有未完成诗的级别）内随机选一首
function getCurrentPoem(){
  if(state.currentPoemKey){
    const p=state.currentPoemKey.split('_');
    const st=parseInt(p[0],10),idx=parseInt(p[1],10);
    if(POEM_STAGES[st]&&POEM_STAGES[st].poems[idx]&&!state.completedPoems[state.currentPoemKey]){
      return {stage:st,stageName:POEM_STAGES[st].name,idx,poem:POEM_STAGES[st].poems[idx],total:POEM_STAGES[st].poems.length};
    }
    state.currentPoemKey=null;
  }
  for(let st=0;st<POEM_STAGES.length;st++){
    const stage=POEM_STAGES[st];
    const avail=[];
    for(let i=0;i<stage.poems.length;i++){
      if(!state.completedPoems[st+'_'+i]) avail.push(st+'_'+i);
    }
    if(avail.length>0){
      const nk=avail[Math.floor(Math.random()*avail.length)];
      state.currentPoemKey=nk;
      saveState();
      const p=nk.split('_');
      return {stage:st,stageName:stage.name,idx:parseInt(p[1],10),poem:stage.poems[parseInt(p[1],10)],total:stage.poems.length};
    }
  }
  return null;
}

// 背诗词卡片的"换一首"按钮：在当前阶段（小学→初中→高中）内随机重选一首未背的
function refreshPoem(){
  const poem=getCurrentPoem();
  if(!poem){showToast('所有诗词都背完啦！🎉');return;}
  const avail=[];
  for(let i=0;i<POEM_STAGES[poem.stage].poems.length;i++){
    if(!state.completedPoems[poem.stage+'_'+i]) avail.push(poem.stage+'_'+i);
  }
  if(avail.length<=1){showToast('本阶段只剩这一首未背的诗词啦');return;}
  let nk=poem.stage+'_'+poem.idx;
  while(nk===poem.stage+'_'+poem.idx){
    nk=avail[Math.floor(Math.random()*avail.length)];
  }
  state.currentPoemKey=nk;
  saveState();
  renderAll();
  const p=nk.split('_');
  showToast(`🎲 换了一首：${POEM_STAGES[poem.stage].poems[parseInt(p[1],10)]}`);
}

// 完成背诗词任务：+白宝石1颗（折合100积分，计入积分数量；背诗不算经验值）
function completePoem(){
  const poem=getCurrentPoem();
  if(!poem){showToast('所有诗词都背完啦！太厉害啦！🎉');return;}
  const key='poem_'+poem.stage+'_'+poem.idx;
  const today=new Date().toISOString().split('T')[0];
  state.completedPoems[poem.stage+'_'+poem.idx]=true;
  state.taskCompletionDates[key]=today;
  state.whiteGems=(state.whiteGems||0)+1;
  state.currentPoemKey=null; // 背完后重新随机选下一首（当前阶段背完自动进入下一阶段）
  saveState();
  renderAll();
  const title=poem.poem.slice(0,poem.poem.indexOf('》')+1);
  showToast(`📜 背出${title}！💎白宝石+1（=100积分）`);
}

// 删除一首已背诗词（成果页）：同步扣除白宝石
function deletePoem(stage,idx){
  const key=stage+'_'+idx;
  if(!state.completedPoems[key]) return;
  delete state.completedPoems[key];
  delete state.taskCompletionDates['poem_'+stage+'_'+idx];
  // 同步扣除奖励：完成时 +1白宝石，删除时 -1白宝石（不低于0）；白宝石折合积分随颗数自动减少
  state.whiteGems=Math.max(0,(state.whiteGems||0)-1);
  if(state.currentPoemKey===key) state.currentPoemKey=null;
  saveState();
  renderAll();
  showToast('🗑 已删除《'+POEM_STAGES[stage].poems[idx].slice(0,POEM_STAGES[stage].poems[idx].indexOf('》')+1)+'》（白宝石-1，折合积分-100）');
}

function getLevel(){
  let current=LEVELS[0];
  for(let l of LEVELS){
    if((state.xpTotal||0)>=l.min) current=l;
  }
  return current;
}

function getNextLevel(){
  const current=getLevel();
  for(let l of LEVELS){
    if(l.lv===current.lv+1) return l;
  }
  return null;
}

function renderHeader(){
  const gradeNames=['','一年级','二年级','三年级','四年级','五年级','六年级'];
  document.getElementById('gradeBadge').textContent=gradeNames[state.grade]+' · '+(state.sem==='b'?'下学期':'上学期');
  
  const level=getLevel();
  const next=getNextLevel();
  let levelText=`Lv.${level.lv} ${level.name}`;
  if(next){
    // 括号内：扣除前几级累计所需经验后，当前级别的经验 / 本级升级需要的总经验
    const progress=Math.max(0,(state.xpTotal||0)-level.min);
    const total=next.min-level.min;
    levelText+=` (${progress}/${total})`;
  }
  document.getElementById('levelText').textContent=levelText;
  
  document.getElementById('streakText').textContent=state.streak+'天';

  // v2.9 积分数量口径：
  // 积分数量（共获得）= 任务积分（打卡/学科/家务）+ 白宝石折合（1颗=100积分）
  // 大字显示 = 兑换完宝石还剩的积分 = 共获得 − 已兑宝石折合（彩色1颗=20积分，白色1颗=100积分）
  const exColor=state.exchangedColorGems||0;
  const exWhite=state.exchangedWhiteGems||0;
  const exPoints=exColor*20+exWhite*100; // 已兑宝石折合积分
  const totalPoints=(state.points||0)+(state.whiteGems||0)*100; // 共获得积分
  const remainPoints=Math.max(0,totalPoints-exPoints); // 兑换完宝石还剩的积分
  document.getElementById('pointsText').textContent=remainPoints;
  document.getElementById('pointsSub').innerHTML=`<span style="font-size:12px;opacity:.9;">已兑宝石折合 ${exPoints} 积分 · 共获得 ${totalPoints} 积分</span>`;

  // 彩色宝石可兑换数量提示

// 手动修改"线下已兑换宝石"数量：只能增加，不能减少
function updateExchangedGem(type,val){
  const n=Math.max(0,parseInt(val,10)||0);
  const key=type==='color'?'exchangedColorGems':'exchangedWhiteGems';
  const gemName=type==='color'?'彩色宝石':'白宝石';
  const old=state[key]||0;
  if(n<old){
    showToast(`❌ 已兑换的${gemName}不能减少哦（只能增加）`);
    document.getElementById(type==='color'?'exColorInput':'exWhiteInput').value=old;
    return;
  }
  if(n===old){
    document.getElementById(type==='color'?'exColorInput':'exWhiteInput').value=old;
    return;
  }
  state[key]=n;
  saveState();
  renderHeader();
  showToast(`✅ 已兑换${gemName}更新为 ${n} 颗（+${(n-old)*(type==='color'?20:50)}积分折算）`);
}

function renderRecommendations(){
  const container=document.getElementById('recommendTasks');
  container.innerHTML='';

  const now=new Date();
  const start=new Date(now.getFullYear(),8,1);
  if(now<start) start.setFullYear(start.getFullYear()-1);
  const weekNum=Math.floor((now-start)/(7*24*60*60*1000))+1;

  const gd=gradeData();
  const weekSeed=getRefreshWeekId()+state.grade*1000+(state.sem==='b'?500:0);

  // 新的一周（周一10点后）：清空上周的推荐与丢弃记录
  if(state.recWeekSeed!==weekSeed){
    state.recWeekSeed=weekSeed;
    state.recSubjectKeys=[];
    state.recDiscardedKeys=[];
  }

  // 每周固定家务任务（不随换任务更换）
  generateHouseholdTasks(false);

  // 收集某学科当前可推荐的任务（语数英科道法只取激活单元，其余学科全单元可选）
  function collectTasks(sid){
    const subject=SUBJECTS.find(s=>s.id===sid);
    const units=gd[sid]||[];
    const list=[];
    units.forEach((unit,ui)=>{
      if(UNIT_GATED_SUBJECTS.includes(sid)&&!isActiveUnit(sid,ui)) return;
      unit.tasks.forEach((task,ti)=>{
        list.push({subject,unit:unit.unit,key:getTaskKey(sid,ui,ti),task});
      });
    });
    return list;
  }

  // 过滤本周推荐key中已失效的（如换学期后残留），其余全部保留展示
  const keptKeys=(state.recSubjectKeys||[]).filter(Boolean).filter(key=>resolveTaskKey(key));
  const excludeSet=new Set([...(state.recSubjectKeys||[]),...(state.recDiscardedKeys||[])]);

  // 1) 本周推荐过的任务：全部保留展示（已完成的显示完成态，未完成的点击可换）
  const picked=[];
  keptKeys.forEach(key=>{
    const t=resolveTaskKey(key);
    if(t) picked.push(t);
  });

  // 该科本周是否已有未完成的推荐（有则不重复推荐）
  function hasFresh(sid){
    return keptKeys.some(k=>{
      if(!k) return false;
      const p=k.split('_');
      return p.length===5&&p[2]===sid&&!state.completedTasks[k];
    });
  }

  // 2) 核心五科（语数英科道法）必含：每科确保1个当前激活单元的未完成任务
  ['chinese','math','english','science','moral'].forEach((sid,idx)=>{
    if(hasFresh(sid)) return;
    const avail=collectTasks(sid).filter(t=>!excludeSet.has(t.key)&&!state.completedTasks[t.key]);
    if(avail.length===0) return; // 该科当前单元任务已全部完成
    const rand=seededRandom(weekSeed+idx*131+(state.sem==='b'?777:0));
    const chosen=avail[Math.floor(rand()*avail.length)];
    state.recSubjectKeys=[...(state.recSubjectKeys||[]),chosen.key];
    picked.push(chosen);
  });

  // 3) 体育/艺术/劳动/综合实践补足：同时最多2个未完成的extra推荐（每科最多1个新任务）
  const extraIds=['pe','art','labor','practice'];
  let extraFreshCount=keptKeys.filter(k=>extraIds.includes(k.split('_')[2])&&!state.completedTasks[k]).length;
  extraIds.forEach((sid,idx)=>{
    if(extraFreshCount>=2) return;
    if(hasFresh(sid)) return;
    const avail=collectTasks(sid).filter(t=>!excludeSet.has(t.key)&&!state.completedTasks[t.key]);
    if(avail.length===0) return;
    const rand=seededRandom(weekSeed+idx*211+(state.sem==='b'?999:0));
    const chosen=avail[Math.floor(rand()*avail.length)];
    state.recSubjectKeys=[...(state.recSubjectKeys||[]),chosen.key];
    picked.push(chosen);
    extraFreshCount++;
  });

  document.getElementById('weekLabel').textContent=`（第${weekNum}周）`;

  // 背诗词任务卡片：单击=完成背诵；右上角刷新按钮=换一首
  const poem=getCurrentPoem();
  if(poem){
    const p=getPoemProgress(poem.stage);
    const pct=Math.round(p.done/p.total*100);
    const div=document.createElement('div');
    div.className='recommend-task poem';
    div.innerHTML=`
      <div class="rec-subject" style="color:#2E7D32;display:flex;align-items:center;gap:6px;">📜 背诗词 · ${poem.stageName}<span class="poem-refresh-btn" onclick="event.stopPropagation();refreshPoem()" title="换一首诗词">🔄</span></div>
      <div class="rec-name">${poem.poem}</div>
      <div class="poem-search" onclick="event.stopPropagation();">
        <input id="poemSearchInput" type="text" placeholder="🔍 搜索诗人或诗名，选一首来背" oninput="renderPoemSearch(this.value)" autocomplete="off">
        <div id="poemSearchResults" class="poem-search-results hidden"></div>
      </div>
      <div class="poem-progress"><div class="poem-progress-fill" style="width:${pct}%"></div></div>
      <div class="rec-points">💎白宝石×1（=100积分，已完成 ${p.done}/${p.total}）· 点击卡片=完成背诵</div>
      ${renderPoemDetail(poem.poem)}
    `;
    div.onclick=completePoem;
    container.appendChild(div);
  }

  // 学科推荐任务：点击=更换任务（已完成不支持更换）
  picked.forEach(t=>{
    const isDone=!!state.completedTasks[t.key];
    const div=document.createElement('div');
    div.className='recommend-task'+(isDone?' done':'');
    div.innerHTML=`<div class="rec-subject" style="color:${t.subject.color}">${t.subject.icon} ${t.subject.name} · ${t.unit}</div><div class="rec-name">${t.task}</div>${isDone?'<div class="rec-points">✅ 已完成</div>':'<div class="rec-points" style="font-size:11px;color:#999;">点击可换一个任务</div>'}`;
    div.onclick=()=>swapRecTask(t.key);
    container.appendChild(div);
  });

  // 家务任务：点击完成，完成后任务框消失（本周内不重复显示）
  const today=new Date().toISOString().split('T')[0];
  state.weeklyHouseholdTasks.forEach((ht,i)=>{
    const hKey=getHouseholdKey(state.householdWeekSeed,i);
    if(state.taskCompletionDates[hKey]) return; // 本周已完成 → 任务框消失
    const div=document.createElement('div');
    div.className='recommend-task household';
    div.innerHTML=`
      <div class="rec-subject" style="color:#8D6E63">🏠 家务实践</div>
      <div class="rec-name">${ht.task}</div>
      <div class="rec-points">+10积分</div>
    `;
    div.onclick=()=>{
      state.taskCompletionDates[hKey]=today;
      state.points+=10;
      state.xpTotal=(state.xpTotal||0)+10;
      saveState();
      renderAll();
      showToast('🏠 完成家务！+10积分');
    };
    container.appendChild(div);
  });

  if(picked.length===0 && state.weeklyHouseholdTasks.length===0 && !poem){
    container.innerHTML='<div style="color:#888;font-size:14px;">当前学期所有任务都完成啦！太棒了！🎉</div>';
  }
}


function renderProgressBars(){

  if(!subject) return;
  
  const gd=gradeData();
  const units=gd[subject.id]||[];
  
  let totalAll=0,doneAll=0;
  units.forEach((unit,ui)=>{
    unit.tasks.forEach((task,ti)=>{
      totalAll++;
      const key=getTaskKey(subject.id,ui,ti);

    });

    <div class="progress-bar-header">

}

function renderTaskCards(){

  if(!subject) return;
  
  const gd=gradeData();
  const units=gd[subject.id]||[];

  units.forEach((unit,ui)=>{
    const card=document.createElement('div');
    card.className='unit-card';
    card.style.borderTop=`3px solid ${subject.color}`;
    
    let doneCount=0;
    let taskHtml='';
    unit.tasks.forEach((task,ti)=>{
      const key=getTaskKey(subject.id,ui,ti);

      taskHtml+=`<div class="task-item ${isDone?'done':''}" data-key="${key}" onclick="toggleTask('${subject.id}',${ui},${ti})">

      <div class="unit-title">
        <span style="color:${subject.color}">${subject.icon}</span>
        <span>${unit.unit}</span>
        <span class="unit-progress">${doneCount}/${unit.tasks.length} (${pct}%)</span>

  });

// ==================== 交互功能 ====================
function toggleTask(subjectId,unitIdx,taskIdx){
  const key=getTaskKey(subjectId,unitIdx,taskIdx);
  const today=new Date().toISOString().split('T')[0];
  if(state.completedTasks[key]){
    delete state.completedTasks[key];
    delete state.taskCompletionDates[key];
    state.points-=10;
    state.xpTotal=Math.max(0,(state.xpTotal||0)-10);
  }else{
    state.completedTasks[key]=true;
    state.taskCompletionDates[key]=today;
    state.points+=10;
    state.xpTotal=(state.xpTotal||0)+10;
    showToast('🎉 完成！+10积分');
  }
  saveState();
  renderAll();
}

function doCheckin(){
  if(state.checkinToday){
    showToast('今天已经打卡啦！');
    return;
  }
  
  // Check if at least one task was completed today
  const todayCount=getTodayCompletedCount();
  if(todayCount===0){
    showToast('今天还没完成任何任务哦！先完成至少一个任务再打卡吧~');
    return;
  }
  
  const today=new Date().toISOString().split('T')[0];
  const yesterday=new Date(Date.now()-86400000).toISOString().split('T')[0];
  
  if(state.lastCheckin===yesterday){
    state.streak++;
  }else{
    state.streak=1;
  }
  
  let earned=5;
  if(state.streak>=7) earned+=5;
  if(state.streak>=14) earned+=5;
  if(state.streak>=30) earned+=10;
  
  state.points+=earned;
  state.xpTotal=(state.xpTotal||0)+earned;
  state.lastCheckin=today;
  state.checkinToday=true;
  state.checkinHistory.push(today);
  
  saveState();
  renderAll();
  showToast(`🎉 打卡成功！连续${state.streak}天，+${earned}积分！今天完成了${todayCount}个任务`);
}

    lines.push('【存档里的数据】');
    lines.push('任务积分：'+(parsed.points||0)+'    经验值：'+(parsed.xpTotal||0)+'    白宝石：'+(parsed.whiteGems||0)+'（折合'+(parsed.whiteGems||0)*100+'积分）');
    lines.push('连续打卡：'+(parsed.streak||0)+'天    最近打卡：'+(parsed.lastCheckin||'无'));
    lines.push('已完成学科任务：'+Object.keys(ct).length+'项');
    lines.push('已背诗词：'+poemKeys.length+'首'+(poemKeys.length?'（'+poemKeys.map(poemTitleByKey).join('、')+'）':''));
    const curCount=Object.keys(state.completedPoems||{}).length;
    lines.push('');
    lines.push('【诊断结论】');
    if(poemKeys.length>0&&curCount===0){
      lines.push('⚠️ 存档里有诗词记录但页面没显示，属于页面加载问题，请联系助手修复');
    }else if(poemKeys.length===0){
      lines.push('❗ 存档本身就没有诗词记录。如果之前明明背过，说明当时记录存在另一个浏览器/另一台设备/另一个文件里');
    }else{
      lines.push('✅ 存档与页面显示一致，数据正常');
    }
  }else{
    lines.push('【诊断结论】');
    lines.push('❗ 这里读不到存档。最常见原因：');
    lines.push('1. 换了浏览器或用了无痕/隐私窗口打开');
    lines.push('2. 打开的不是原来那个文件（副本/检查点文件在 Safari 里是独立存储）');
    lines.push('3. 浏览器清理了网站数据');
    lines.push('解决办法：回到原来用的浏览器，打开原来那个文件。');
  }
  lines.push('');
  lines.push('💡 建议：定期用「导出数据」备份，换设备时用「导入数据」恢复。');
  // 弹窗展示
  let mask=document.getElementById('diagMask');
  if(mask) mask.remove();
  mask=document.createElement('div');
  mask.id='diagMask';
  mask.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:3000;display:flex;align-items:center;justify-content:center;padding:20px;';
  const box=document.createElement('div');
  box.style.cssText='background:#fff;border-radius:14px;max-width:520px;max-height:80vh;overflow:auto;padding:22px 24px;font-size:14px;line-height:1.7;color:#333;box-shadow:0 10px 40px rgba(0,0,0,.25);';
  box.innerHTML='<div style="font-size:16px;font-weight:700;margin-bottom:10px;">🔍 数据体检报告</div>'+
    '<pre style="white-space:pre-wrap;font-family:inherit;margin:0;">'+lines.join('\n').replace(/</g,'&lt;')+'</pre>'+
    '<button style="margin-top:16px;width:100%;padding:10px;border:none;border-radius:8px;background:#4A90D9;color:#fff;font-size:14px;cursor:pointer;" onclick="document.getElementById(\'diagMask\').remove()">我知道了</button>';
  mask.appendChild(box);
  mask.onclick=function(ev){if(ev.target===mask)mask.remove();};
  document.body.appendChild(mask);
}

function exportData(){
  const data={
    ...state,
    exportDate:new Date().toISOString(),
    version:'2.8.1',
  };
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download=`喻慕左学习数据_${new Date().toISOString().split('T')[0]}.json`;
  a.click();
  URL.revokeObjectURL(url);
  showToast('📤 数据已导出！');
}

function importData(event){
  const file=event.target.files[0];
  if(!file) return;
  const reader=new FileReader();
  reader.onload=function(e){
    try{
      const data=JSON.parse(e.target.result);
      if(data.grade===undefined && data.points===undefined){
        showToast('❌ 文件格式不正确！');
        return;
      }
      state={...state,...data};
      delete state.exportDate; delete state.version;
      if(!state.sem) state.sem='a';
      if(!state.view) state.view='home';
      if(!state.currentPoemKey) state.currentPoemKey=null;
      if(state.weeklyGemRedeemed===undefined) state.weeklyGemRedeemed=null;
      migrateTaskKeys();
      if(!state.taskCompletionDates) state.taskCompletionDates={};
      if(!state.weeklyHouseholdTasks) state.weeklyHouseholdTasks=[];
      if(!state.householdWeekSeed) state.householdWeekSeed=0;
      if(!state.completedPoems) state.completedPoems={};
      if(!state.whiteGems) state.whiteGems=0;
      if(!state.householdRefreshCount) state.householdRefreshCount=0;
      if(!state.recSubjectKeys) state.recSubjectKeys=[];
      if(!state.recWeekSeed) state.recWeekSeed=0;
      if(!state.recDiscardedKeys) state.recDiscardedKeys=[];
      if(state.exchangedColorGems===undefined) state.exchangedColorGems=0;
      if(state.exchangedWhiteGems===undefined) state.exchangedWhiteGems=0;
      state.householdWeekSeed=0;
      state.weeklyHouseholdTasks=[];
      // 一次性积分清零（与 loadState 保持一致）
      if(state.pointsResetV1!==true){ state.points=0; state.pointsResetV1=true; }
      const today=new Date().toISOString().split('T')[0];
      state.checkinToday=(state.lastCheckin===today);
      saveState();
      renderAll();
      showToast('📥 数据导入成功！');
    }catch(err){
      showToast('❌ 导入失败：'+err.message);
    }
  };
  reader.readAsText(file);
  event.target.value='';
}

function showToast(msg){
  const toast=document.createElement('div');
  toast.className='toast';
  toast.textContent=msg;
  document.body.appendChild(toast);
  setTimeout(()=>{
    toast.style.opacity='0';
    toast.style.transition='opacity 0.3s';
    setTimeout(()=>toast.remove(),300);
  },2500);
}

// ==================== 初始化 ====================
loadState();
renderAll();

// Check for streak reset
if(state.lastCheckin && !state.checkinToday){
  const today=new Date();
  const last=new Date(state.lastCheckin);
  const diff=Math.floor((today-last)/(86400000));
  if(diff>1){
    state.streak=0;
    saveState();
  }
}

// 每周一 10:00 自动刷新本周推荐任务（页面持续打开时也生效）
setInterval(()=>{
  const rid=getRefreshWeekId()+state.grade*1000+(state.sem==='b'?500:0);
  if(state.recWeekSeed!==0 && state.recWeekSeed!==rid){
    state.recWeekSeed=rid;
    state.recSubjectKeys=[];
    state.recDiscardedKeys=[];
    generateHouseholdTasks(true);
    saveState();
    renderAll();
    showToast('🔄 每周一10点：本周推荐任务已自动刷新');
  }
},60000);
</script>
